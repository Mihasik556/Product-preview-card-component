<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="css/style.css" />
        <title>Frontend Mentor | Product preview card component</title>
    </head>
    <body>
        <main>
            <article class="product">
                <section>
                    <figure>
                        <div class="product__img" role="img"></div>
                    </figure>
                </section>
                <section class="product__info">
                    <section class="product__text-block">
                        <p class="product__label">Perfume</p>
                        <h1 class="product__title">
                            Gabrielle Essence Eau De Parfum
                        </h1>
                        <p class="product__text">
                            A floral, solar and voluptuous interpretation
                            composed by Olivier Polge, Perfumer-Creator for the
                            House of CHANEL.
                        </p>
                    </section>
                    <section class="product__price-block">
                        <span class="product__main-price">$149.99</span>
                        <span class="product__deleted-price">$169.99</span>
                    </section>
                    <button class="product__buy-button">
                        <img
                            src="/assets/images/icon-cart.svg"
                            alt="Cart icon svg"
                        />
                        <p>Add to Cart</p>
                    </button>
                </section>
            </article>
        </main>
        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
